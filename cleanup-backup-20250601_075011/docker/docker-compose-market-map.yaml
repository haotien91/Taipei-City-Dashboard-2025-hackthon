version: '3.8'

services:
  market-map-init:
    image: postgres:15-alpine
    depends_on:
      - postgres-manager
    volumes:
      - ../db-sample-data/market-events-map-init.sql:/docker-entrypoint-initdb.d/market-events-map-init.sql:ro
    environment:
      PGPASSWORD: password
    command: |
      sh -c "
        echo '🚀 開始配置市集活動地圖...'
        sleep 3
        psql -h postgres-manager -U postgres -d dashboardmanager -f /docker-entrypoint-initdb.d/market-events-map-init.sql
        echo '✅ 市集活動地圖配置完成！'
        echo '📍 地圖將顯示紅色圓點標示各市集位置'
        echo '💡 請重啟後端服務並重新整理前端頁面'
      "
    networks:
      - postgres_network

  postgres-manager:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dashboardmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

volumes:
  postgres_data:
    external: true

networks:
  postgres_network:
    external: true 